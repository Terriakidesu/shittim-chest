name: Weekly forecast refresh

# Rebuilds the static forecast snapshot from the upstream sources and commits
# it. Pushing to main triggers the pages workflow, which redeploys.
# Cadence matches REFRESH_INTERVAL_DAYS (7): banners rotate on a 7-14 day
# cycle, so anything more frequent is wasted upstream requests.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Rebuild forecast data and artwork
        run: bun run export
      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/img
          if git diff --quiet --cached; then
            echo "Forecast snapshot is already up to date."
          else
            git commit -m "chore(data): weekly forecast refresh

            Regenerated by the scheduled forecast workflow (scripts/export.ts):
            fresh wiki + SchaleDB snapshot, rebuilt predictions, mirrored
            artwork. See public/data/status.json for the export time."
            git push
          fi
