<!doctype html>
<!--
  Route document for /calendar.

  Path-based, not hash-based: a URL fragment never reaches the server, so
  `/#/calendar` and `/#/simulator` are the same bytes to a crawler and every
  shared link produced the same social card. Each route therefore has its own
  file, and this one carries the calendar's metadata. See src/client/route.ts.

  It sits flat beside index.html rather than in a subdirectory, which is what
  keeps every relative asset URL (./assets/..., ./data/...) resolving correctly
  from any route at any subpath.

  The og:image URL must be absolute and static HTML cannot compute it, so the
  origin is hardcoded here. Update it here, in index.html, simulator.html,
  about.html and sitemap.xml if the site moves to another domain. The runtime
  copy in src/client/seo.ts resolves against location.href and follows the
  domain by itself.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gacha Calendar — Shittim Chest</title>
    <meta
      name="description"
      content="Every JP and Global gacha banner on one calendar: what is live now, and when Global is expected to catch up."
    />
    <link rel="canonical" href="https://terriakidesu.github.io/shittim-chest/calendar.html" />
    <link rel="icon" type="image/svg+xml" href="./shittim-chest.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shittim Chest" />
    <meta property="og:title" content="Gacha Calendar — Shittim Chest" />
    <meta
      property="og:description"
      content="Every JP and Global gacha banner on one calendar: what is live now, and when Global is expected to catch up."
    />
    <meta property="og:url" content="https://terriakidesu.github.io/shittim-chest/calendar.html" />
    <meta property="og:image" content="https://terriakidesu.github.io/shittim-chest/og/calendar.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Shittim Chest gacha calendar, showing JP and Global banner history"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gacha Calendar — Shittim Chest" />
    <meta
      name="twitter:description"
      content="Every JP and Global gacha banner on one calendar: what is live now, and when Global is expected to catch up."
    />
    <meta name="twitter:image" content="https://terriakidesu.github.io/shittim-chest/og/calendar.png" />
    <meta
      name="twitter:image:alt"
      content="The Shittim Chest gacha calendar, showing JP and Global banner history"
    />
    <script type="module" crossorigin src="./assets/main-COCwr25T.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-BFTtjT4S.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
