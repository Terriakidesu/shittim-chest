<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shittim Chest — Gacha Calendar</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <p>Redirecting… <a id="fallback" href="./">Shittim Chest</a></p>
    <script>
      // GitHub Pages serves no rewrite rules, so anything that is not a real
      // file lands here. Normalise the two shapes that should still work:
      // a trailing-slash form (/calendar/) and any pre-migration hash link
      // (#/calendar, /#/simulator), which is what older bookmarks and shared
      // links use. Everything else falls back to the calendar.
      (function () {
        var KNOWN = { calendar: 1, simulator: 1, about: 1 };
        var parts = window.location.pathname.split("/").filter(Boolean);
        var last = (parts.length ? parts[parts.length - 1] : "").replace(/\.html$/i, "");

        // A legacy hash route wins over the path: /#/simulator means simulator.
        var hashRoute = /^#\/?(calendar|simulator|about)/.exec(window.location.hash);
        if (hashRoute) last = hashRoute[1];

        // Rebuild the path inside this directory. Careful at the domain root:
        // joining an empty parent yields "//", which is a protocol-relative URL
        // and would resolve to a bogus host.
        var parent = parts.length > 1 ? parts.slice(0, -1).join("/") : "";
        var prefix = parent ? "/" + parent + "/" : "/";
        var target = KNOWN[last]
          ? prefix + last + ".html" + window.location.search
          : prefix + "calendar.html" + window.location.search;
        document.getElementById("fallback").href = target;
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
