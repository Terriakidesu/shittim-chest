<!doctype html>
<!--
  Crawler-visible entry for the calendar route.

  The app routes by URL fragment, and fragments never reach the server, so
  `/#/calendar` and `/#/about` are the same document to any crawler. This shim is
  a real, distinct document carrying the calendar's metadata; it then forwards
  to the hash route so the SPA takes over. Share the `.html` URL, not the
  fragment.

  The og:image URL must be absolute, so unlike src/client/seo.ts (which resolves
  against location.origin) it is hardcoded here. Update the origin literals in
  this file, public/simulator.html, public/about.html, public/sitemap.xml and
  index.html if the site moves to another domain.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gacha Calendar — Shittim Chest</title>
    <meta
      name="description"
      content="Every JP and Global gacha banner on one calendar: what is live now, and when Global is expected to catch up."
    />
    <link rel="canonical" href="https://terriakidesu.github.io/shittim-chest/calendar.html" />
    <link rel="icon" type="image/svg+xml" href="./shittim-chest.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shittim Chest" />
    <meta property="og:title" content="Gacha Calendar — Shittim Chest" />
    <meta
      property="og:description"
      content="Every JP and Global gacha banner on one calendar: what is live now, and when Global is expected to catch up."
    />
    <meta property="og:url" content="https://terriakidesu.github.io/shittim-chest/calendar.html" />
    <meta property="og:image" content="https://terriakidesu.github.io/shittim-chest/og/calendar.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Shittim Chest gacha calendar, showing JP and Global banner history"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gacha Calendar — Shittim Chest" />
    <meta
      name="twitter:description"
      content="Every JP and Global gacha banner on one calendar: what is live now, and when Global is expected to catch up."
    />
    <meta name="twitter:image" content="https://terriakidesu.github.io/shittim-chest/og/calendar.png" />
    <meta
      name="twitter:image:alt"
      content="The Shittim Chest gacha calendar, showing JP and Global banner history"
    />
  </head>
  <body>
    <p>Loading the calendar… <a href="./#/calendar">Shittim Chest</a></p>
    <script>
      // replace, not assign, so Back does not bounce through this shim again.
      location.replace("./#/calendar");
    </script>
  </body>
</html>
